<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GridWork avatar mark — Signal palette: bg #070B10, hue #6BDBFF (dim #3FA8CC, bright #9AE8FF) -->
  <rect width="1024" height="1024" fill="#070B10"/>
  <!-- 2x2 grid, 180px cells, 60px gap, centered (block 420x420 at 302,302) -->
  <!-- top-left cell: the prompt chevron -->
  <path d="M 358 336 L 442 392 L 358 448" fill="none" stroke="#9AE8FF" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- top-right, bottom-left: solid cells -->
  <rect x="542" y="302" width="180" height="180" rx="36" fill="#6BDBFF"/>
  <rect x="302" y="542" width="180" height="180" rx="36" fill="#6BDBFF"/>
  <!-- bottom-right: dim cell (an idle agent in the fleet) -->
  <rect x="542" y="542" width="180" height="180" rx="36" fill="#3FA8CC"/>
</svg>
